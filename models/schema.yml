version: 2

models:
  - name: stg_taxi_trips
    description: Cleaned taxi trip data

    columns:
      - name: VendorID
        tests:
          - not_null

      - name: trip_distance
        tests:
          - not_null

      - name: total_amount
        tests:
          - not_null

  - name: taxi_analytics
    description: Taxi trips with calculated metrics

    columns:
      - name: VendorID
        tests:
          - not_null

      - name: trip_distance
        tests:
          - not_null

      - name: total_amount
        tests:
          - not_null